services:
  cheeseplate:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: file:/app/data/cheeseplate.sqlite
      # TG_HTTPS_PROXY: http://proxy:3128
      # TG_HTTP_PROXY: http://proxy:3128
      # TG_NO_PROXY: api.telegram.org
    volumes:
      - cheeseplate-data:/app/data

volumes:
  cheeseplate-data:
